services:
  db:
    ports:
      - "5434:5432"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    ports:
      - "8088:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Cors__Origins: http://localhost:5173,http://localhost:3010
      S3__Endpoint: http://minio:9000

  web:
    ports:
      - "3010:3000"
    networks:
      - internal

networks:
  dokploy-network:
    external: false
    name: madplan_local_proxy
