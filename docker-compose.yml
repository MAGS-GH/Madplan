services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-madplan}
      POSTGRES_USER: ${POSTGRES_USER:-madplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-madplan}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-madplan} -d ${POSTGRES_DB:-madplan}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-madplan}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-madplanmadplan}
    volumes:
      - minio_data:/data
    networks:
      - internal

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set download "local/$$S3_BUCKET"
        exit 0
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-madplan}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-madplanmadplan}
      S3_BUCKET: ${S3_BUCKET:-madplan}
    networks:
      - internal
    restart: "no"

  api:
    build: ./api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-madplan};Username=${POSTGRES_USER:-madplan};Password=${POSTGRES_PASSWORD:-madplan}
      OpenAI__ApiKey: ${OpenAI__ApiKey:-}
      OpenAI__Model: ${OpenAI__Model:-gpt-4o-mini}
      Cors__Origins: ${Cors__Origins:-https://mad.mercantec.tech}
      S3__Endpoint: ${S3__Endpoint:-http://minio:9000}
      S3__AccessKey: ${S3_ACCESS_KEY:-madplan}
      S3__SecretKey: ${S3_SECRET_KEY:-madplanmadplan}
      S3__Bucket: ${S3_BUCKET:-madplan}
      S3__PublicBasePath: ${S3__PublicBasePath:-/media}
      S3__ForcePathStyle: ${S3__ForcePathStyle:-true}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - internal

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      - api
      - minio
    networks:
      - internal
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.madplan.rule=Host(`mad.mercantec.tech`)
      - traefik.http.routers.madplan.entrypoints=web
      - traefik.http.routers.madplan.service=madplan
      - traefik.http.services.madplan.loadbalancer.server.port=3000

volumes:
  db_data:
  minio_data:

networks:
  internal:
  dokploy-network:
    external: true
