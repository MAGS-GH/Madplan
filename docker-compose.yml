services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-madplan}
      POSTGRES_USER: ${POSTGRES_USER:-madplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-madplan}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-madplan} -d ${POSTGRES_DB:-madplan}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build: ./api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-madplan};Username=${POSTGRES_USER:-madplan};Password=${POSTGRES_PASSWORD:-madplan}
      OpenAI__ApiKey: ${OpenAI__ApiKey:-}
      OpenAI__Model: ${OpenAI__Model:-gpt-4o-mini}
      Cors__Origins: ${Cors__Origins:-https://mad.mercantec.tech}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - internal
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.madplan.rule=Host(`mad.mercantec.tech`)
      - traefik.http.routers.madplan.entrypoints=web
      - traefik.http.routers.madplan.service=madplan
      - traefik.http.services.madplan.loadbalancer.server.port=3000

volumes:
  db_data:

networks:
  internal:
  dokploy-network:
    external: true
